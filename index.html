<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Porsche</title>
</head>
<body>
    <header>
        <img src="porsche.png" alt="logo" class="logo">
        <nav>
            <ul>
                <li><a href="#">HIGHLIGHTS</a></li>
                <li><a href="#">DESIGN</a></li>
                <li><a href="#">PERFORMANCE</a></li>
                <li><a href="#">CHARGING</a></li>
                <li><a href="#">CONFIGURE</a></li>
            </ul>
        </nav>
        <a href="#" class="button">TEST DRIVE</a>
    </header>
    <main>
        <h1>TAYCAN</h1>
        <img src="porscheimg.png" alt="">
    </main>
    <footer>
        <div class="name">
            <h2>PORSCHE</h2>
            <p>TAYCAN Turbo S</p>
        </div>
        <div class="data">
            <div class="o1">
                <p class="info">WLTP</p>
                <p class="dataset">412km</p>
            </div>
            <div class="o2">
                <p class="info">0-1000KM/h</p>
                <p class="dataset">2.8s</p>
            </div>
            <div class="o3">
                <p class="info">HP</p>
                <p class="dataset">560</p>
            </div>
        </div>
        <div class="img">
            <img src="images01.jpg" alt="">
            <img src="images02.jpg" alt="">
            <img src="images03.jpg" alt="">
        </div>
    </footer>
</body>
</html>
